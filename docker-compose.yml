version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: optibud_postgres
    environment:
      POSTGRES_USER: optibud_user
      POSTGRES_PASSWORD: optibud_password
      POSTGRES_DB: optibud_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: