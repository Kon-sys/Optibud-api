version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: optibud_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
     interval: 5s
     timeout: 5s
     retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile_back
    container_name: optibud_backend
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: "."
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      migration:
        condition: service_completed_successfully # Ждем успешного окончания миграций

  migration:
    build:
      context: .
      dockerfile: Dockerfile_back
    container_name: optibud_migration
    environment:
      PYTHONPATH: "."
      POSTGRES_HOST: "optibud_postgres"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  data: